name: build-windows
on:
    workflow_call:
        inputs:
            dry:
                default: false
                description: Prevent signing and upload
                required: false
                type: boolean
        secrets:
            TAURI_PRIVATE_KEY:
                required: false
            TAURI_KEY_PASSWORD:
                required: false

permissions:
    contents: read

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'

            - name: Install pnpm
              run: npm install -g pnpm
              shell: pwsh

            - name: Install frontend deps
              run: pnpm install
              shell: pwsh

            - name: Build Windows installer
              run: pnpm tauri build --bundles nsis
              shell: pwsh

            - name: Restore Tauri signing key
              if: ${{ inputs.dry == false }}
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
              run: |
                  [System.IO.File]::WriteAllBytes("tauri.key", [Convert]::FromBase64String($env:TAURI_PRIVATE_KEY))
              shell: pwsh

            - name: Sign installer with Tauri signer
              if: ${{ inputs.dry == false }}
              env:
                  TAURI_PRIVATE_KEY_PATH: tauri.key
                  TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              shell: pwsh
              run: |
                  $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -ExpandProperty FullName
                  if ($exe) {
                    pnpm tauri signer sign $exe
                  } else {
                    Write-Host "No installer found to sign."
                  }

            - name: Rename files
              if: ${{ inputs.dry == false }}
              shell: pwsh
              run: |
                  $d = "src-tauri/target/release/bundle/nsis"
                  Get-ChildItem $d -Filter *.exe | Select-Object -First 1 | ForEach-Object { Move-Item $_.FullName "$d/Murmure_x64.msi" -Force }
                  Get-ChildItem $d -Filter *.sig | Select-Object -First 1 | ForEach-Object { Move-Item $_.FullName "$d/Murmure_x64.msi.sig" -Force }

            - name: Upload artifact (1 day)
              if: ${{ inputs.dry == false }}
              uses: actions/upload-artifact@v4
              with:
                  name: Murmure_x64.msi
                  path: src-tauri/target/release/bundle/nsis/Murmure_x64.msi
                  retention-days: 1

            - name: Upload signature
              if: ${{ inputs.dry == false }}
              uses: actions/upload-artifact@v4
              with:
                  name: Murmure_x64.msi.sig
                  path: src-tauri/target/release/bundle/nsis/Murmure_x64.msi.sig
                  retention-days: 1
